<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <link rel="stylesheet" type="text/css" href="css.css">
        <script src="js.js" defer></script>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta
            name="description"
            content="A free tool that takes in a 17 character VIN (Vehicle Identification Number) and gives back details about the vehicle's country of origin, manufacturer, model, body style, engine, transmission, tri…">
        <title>VIN Decoder</title>
    </head>
    <body>
        
        <h1>VIN Decoder</h1>

        <section id="formSection" >
            <form id="form">
                <label for="vin">VIN:</label>
                <input type="text" minlength="17" maxlength="17" id="vin" name="vin" style="text-transform: uppercase;" required>
                <button type="submit">Submit</button>
            </form>
        </section>

        <section id="resultSection">
            <fieldset>
                <legend>Result</legend>
                <p id="result"></p>
            </fieldset>
        </section>

    </body>
</html>
